server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shivashahi}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  seed-demo: ${SEED_DEMO:false}
  jwt-secret: ${JWT_SECRET:}
